name: CD

# main 合入 → 构建并发布 Docker 镜像到 GHCR（部署见 deploy/README.md）
# 打 v* tag → 额外把前后端构建产物挂到 GitHub Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: 构建并发布镜像（GHCR）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/wemove-course-team/wemove-backend:latest
            ghcr.io/wemove-course-team/wemove-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: 前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/wemove-course-team/wemove-frontend:latest
            ghcr.io/wemove-course-team/wemove-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  release:
    name: 发布构建产物（v* tag）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: 构建后端产物
        run: npm ci && npm run build
        working-directory: backend
      - name: 构建前端产物
        run: npm ci && npm run build
        working-directory: frontend
      - name: 打包
        run: |
          cd backend && zip -qr ../wemove-backend-dist.zip dist package.json package-lock.json && cd ..
          cd frontend && zip -qr ../wemove-frontend-dist.zip dist && cd ..
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wemove-backend-dist.zip
            wemove-frontend-dist.zip
