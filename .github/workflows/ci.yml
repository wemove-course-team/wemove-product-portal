name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端 · 单测 + e2e + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wemove123
          MYSQL_DATABASE: wemove_portal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pwemove123"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 生产依赖安全审计（阻断 high/critical）
        run: npm audit --omit=dev --audit-level=high
      - name: 单元测试
        run: npm test
      - name: 端到端测试（真实 MySQL，库表自动初始化）
        run: npm run test:e2e
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: wemove123
      - name: 构建
        run: npm run build

  frontend:
    name: 前端 · 构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 生产依赖安全审计（阻断 high/critical）
        run: npm audit --omit=dev --audit-level=high
      - name: 前端单元测试
        run: npm test
      - name: 构建
        run: npm run build

  containers:
    name: 部署镜像 · Docker 构建验证
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.3.0
      - name: 验证后端镜像
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./backend
          push: false
          load: true
          tags: wemove-backend:local
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: 验证前端镜像
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./frontend
          push: false
          load: true
          tags: wemove-frontend:local
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Compose 新卷启动与持久化冒烟
        env:
          COMPOSE_PROJECT_NAME: wemove-ci-${{ github.run_id }}
          WEMOVE_HTTP_PORT: 18080
        run: |
          docker compose --env-file deploy/.env.example \
            -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml \
            up -d --no-build --wait --wait-timeout 240
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:18080/healthz
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:18080/api/v1/health
          curl --fail http://127.0.0.1:18080/api/v1/site/config | grep -F 'WEMOVE 惟木匠心'
          curl --fail http://127.0.0.1:18080/api/v1/categories | grep -F '益智玩具'
          curl --fail http://127.0.0.1:18080/api/v1/faqs | grep -F '如何查看产品资料'
          docker compose --env-file deploy/.env.example \
            -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml \
            exec -T mysql sh -c \
            'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" wemove_portal -e "UPDATE site_config SET config_value=\"CI-PERSISTENCE\" WHERE config_key=\"siteName\""'
          docker compose --env-file deploy/.env.example \
            -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml restart mysql
          docker compose --env-file deploy/.env.example \
            -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml \
            up -d --no-build --wait --wait-timeout 180
          docker compose --env-file deploy/.env.example \
            -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml \
            exec -T mysql sh -c \
            'mysql -N -uroot -p"$MYSQL_ROOT_PASSWORD" wemove_portal -e "SELECT config_value FROM site_config WHERE config_key=\"siteName\""' \
            | grep -Fx 'CI-PERSISTENCE'
      - name: Compose 失败日志
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: wemove-ci-${{ github.run_id }}
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml logs --no-color --tail 200
      - name: 清理 Compose
        if: always()
        env:
          COMPOSE_PROJECT_NAME: wemove-ci-${{ github.run_id }}
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml down -v --remove-orphans
