# WEMOVE 平台部署编排。敏感值必须写入 deploy/.env，禁止在本文件中硬编码。
name: wemove-product-portal

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wemove_portal
      MYSQL_USER: ${MYSQL_USER:-wemove}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 设置 MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # MySQL 官方镜像仅在新数据卷首次启动时按文件名顺序执行这些脚本。
      # 顺序必须与 backend/test/setup-db.ts 保持一致；统一使用三位编号避免字典序错位。
      - ../backend/sql/init_schema_and_data.sql:/docker-entrypoint-initdb.d/010-schema.sql:ro
      - ../backend/sql/migrations/mvp01_identity_password_reset.sql:/docker-entrypoint-initdb.d/020-identity-migration.sql:ro
      - ../backend/sql/migrations/mvp03_catalog_incremental.sql:/docker-entrypoint-initdb.d/030-catalog-migration.sql:ro
      - ../backend/sql/migrations/mvp04_content_tables.sql:/docker-entrypoint-initdb.d/040-content-migration.sql:ro
      - ../backend/sql/migrations/mvp05_support.sql:/docker-entrypoint-initdb.d/050-support-migration.sql:ro
      - ../backend/sql/migrations/mvp06_dealer_application_user.sql:/docker-entrypoint-initdb.d/060-dealer-migration.sql:ro
      - ../backend/sql/migrations/mvp07_operation_tables.sql:/docker-entrypoint-initdb.d/070-operation-migration.sql:ro
      - ../backend/sql/migrations/mvp08_dealer_workspace.sql:/docker-entrypoint-initdb.d/075-dealer-workspace-migration.sql:ro
      - ../backend/sql/seed/seed_catalog_mvp03.sql:/docker-entrypoint-initdb.d/080-catalog-seed.sql:ro
      - ../backend/sql/seed/seed_content_mvp04.sql:/docker-entrypoint-initdb.d/090-content-seed.sql:ro
      - ../backend/sql/seed/seed_operation_mvp07.sql:/docker-entrypoint-initdb.d/100-operation-seed.sql:ro
      - ../backend/sql/seed/seed_dealer_workspace_mvp08.sql:/docker-entrypoint-initdb.d/105-dealer-workspace-seed.sql:ro
      - ../backend/sql/migrations/mvp07_utf8_repair.sql:/docker-entrypoint-initdb.d/110-utf8-repair.sql:ro
      # 已知口令的演示账号只挂载、不自动导入；需要时按 deploy/README 手动执行。
      - ../backend/sql/seed/seed_identity_demo_accounts.sql:/opt/wemove/seed/identity-demo.sql:ro
      # 旧数据卷升级用：MVP-07 运营 seed（幂等，不覆盖已有配置/Banner），按 README 手动导入。
      - ../backend/sql/seed/seed_operation_mvp07.sql:/opt/wemove/seed/seed_operation_mvp07.sql:ro
      # 升级路径：已有数据卷不会重新执行初始化脚本，新迁移按 README「升级与回滚」手动应用。
      - ../backend/sql/migrations/mvp04_content_tables.sql:/opt/wemove/migrations/mvp04_content_tables.sql:ro
      - ../backend/sql/migrations/mvp05_support.sql:/opt/wemove/migrations/mvp05_support.sql:ro
      - ../backend/sql/migrations/mvp06_dealer_application_user.sql:/opt/wemove/migrations/mvp06_dealer_application_user.sql:ro
      - ../backend/sql/migrations/mvp07_operation_tables.sql:/opt/wemove/migrations/mvp07_operation_tables.sql:ro
      - ../backend/sql/migrations/mvp08_dealer_workspace.sql:/opt/wemove/migrations/mvp08_dealer_workspace.sql:ro
      - ../backend/sql/migrations/mvp07_utf8_repair.sql:/opt/wemove/migrations/mvp07_utf8_repair.sql:ro
      - ../backend/sql/seed/seed_dealer_workspace_mvp08.sql:/opt/wemove/seed/seed_dealer_workspace_mvp08.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  backend:
    # 镜像标签必填且必须为已验证的完整提交 SHA（见 deploy/README.md「升级与回滚」）。
    image: ghcr.io/wemove-course-team/wemove-backend:${IMAGE_TAG:?请在 deploy/.env 设置 IMAGE_TAG 为 CI/CD 验证过的完整提交 SHA}
    environment:
      NODE_ENV: production
      PORT: "3001"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER:-wemove}
      DB_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 设置 MYSQL_PASSWORD}
      DB_NAME: wemove_portal
      JWT_SECRET: ${JWT_SECRET:?请在 deploy/.env 设置 JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/categories').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  frontend:
    image: ghcr.io/wemove-course-team/wemove-frontend:${IMAGE_TAG:?请在 deploy/.env 设置 IMAGE_TAG 为 CI/CD 验证过的完整提交 SHA}
    ports:
      - "${WEMOVE_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      # edge 网络只承载前端发布端口；数据库和后端仍仅位于 internal 网络。
      - edge

volumes:
  mysql-data:

networks:
  internal:
    internal: true
  edge:
