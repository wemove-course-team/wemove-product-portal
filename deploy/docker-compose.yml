# WEMOVE 平台一键部署（MySQL + 后端 + 前端/nginx）
#
# 前置：镜像已由 CD 流水线发布到 GHCR（push main 自动触发）；
#       也可本地构建：docker build -t ghcr.io/wemove-course-team/wemove-backend ./backend 等。
#
# 首次启动需初始化数据库（一次性）：
#   docker compose up -d mysql
#   docker compose exec mysql sh -c \
#     'mysql -uroot -p$MYSQL_ROOT_PASSWORD < /sql/init_schema_and_data.sql && \
#      mysql -uroot -p$MYSQL_ROOT_PASSWORD wemove_portal < /sql/migrations/mvp03_catalog_incremental.sql && \
#      mysql -uroot -p$MYSQL_ROOT_PASSWORD wemove_portal < /sql/seed/seed_catalog_mvp03.sql && \
#      mysql -uroot -p$MYSQL_ROOT_PASSWORD wemove_portal < /sql/seed/seed_identity_demo_accounts.sql'
#   docker compose up -d backend frontend
#
# 访问：http://localhost:8080 （前端）→ /api 同源转发到后端
# 登录演示账号见 backend/README.md（首次部署后建议改掉口令）

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: wemove123
      MYSQL_DATABASE: wemove_portal
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 只读挂载 SQL 目录，供上面的首次初始化命令使用
      - ../backend/sql:/sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pwemove123"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ghcr.io/wemove-course-team/wemove-backend:latest
    environment:
      PORT: "3001"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: wemove123
      DB_NAME: wemove_portal
      # 生产部署必须替换为强随机值
      JWT_SECRET: change-me-in-production
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/wemove-course-team/wemove-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
