# WEMOVE 平台部署编排。敏感值必须写入 deploy/.env，禁止在本文件中硬编码。
name: wemove-product-portal

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wemove_portal
      MYSQL_USER: ${MYSQL_USER:-wemove}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 设置 MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # MySQL 官方镜像仅在新数据卷首次启动时按文件名顺序执行这些脚本。
      - ../backend/sql/init_schema_and_data.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../backend/sql/migrations/mvp01_identity_password_reset.sql:/docker-entrypoint-initdb.d/20-identity-migration.sql:ro
      - ../backend/sql/migrations/mvp03_catalog_incremental.sql:/docker-entrypoint-initdb.d/30-catalog-migration.sql:ro
      - ../backend/sql/migrations/mvp04_content_tables.sql:/docker-entrypoint-initdb.d/40-content-migration.sql:ro
      - ../backend/sql/migrations/mvp05_support.sql:/docker-entrypoint-initdb.d/50-support-migration.sql:ro
      - ../backend/sql/migrations/mvp06_dealer_application_user.sql:/docker-entrypoint-initdb.d/60-dealer-migration.sql:ro
      - ../backend/sql/seed/seed_catalog_mvp03.sql:/docker-entrypoint-initdb.d/70-catalog-seed.sql:ro
      - ../backend/sql/seed/seed_content_mvp04.sql:/docker-entrypoint-initdb.d/80-content-seed.sql:ro
      - ../backend/sql/migrations/mvp05_support.sql:/opt/wemove/migrations/mvp05_support.sql:ro
      - ../backend/sql/migrations/mvp06_dealer_application_user.sql:/opt/wemove/migrations/mvp06_dealer_application_user.sql:ro
      # 已知口令的演示账号只挂载、不自动导入；需要时按 deploy/README 手动执行。
      - ../backend/sql/seed/seed_identity_demo_accounts.sql:/opt/wemove/seed/identity-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  backend:
    image: ghcr.io/wemove-course-team/wemove-backend:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: "3001"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER:-wemove}
      DB_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 设置 MYSQL_PASSWORD}
      DB_NAME: wemove_portal
      JWT_SECRET: ${JWT_SECRET:?请在 deploy/.env 设置 JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/api/v1/categories"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  frontend:
    image: ghcr.io/wemove-course-team/wemove-frontend:${IMAGE_TAG:-latest}
    ports:
      - "${WEMOVE_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

volumes:
  mysql-data:

networks:
  internal:
    internal: true
